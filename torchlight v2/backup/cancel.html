<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Torchlight Consulting</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <img src="assets/images/torchlight-logo.png" alt="Torchlight" class="brand-logo">
                <span class="brand-name">Torchlight Consulting</span>
            </div>
        </nav>
    </header>

    <section class="cancel-page">
        <div class="container">
            <div class="cancel-content">
                <div class="cancel-icon">×</div>
                <h1>Payment Cancelled</h1>
                <p>Your payment was cancelled. No charges were made to your account.</p>
                <div class="action-buttons">
                    <a href="/" class="btn-secondary">Return to Home</a>
                    <a href="#contact" class="btn-primary">Contact Us Instead</a>
                </div>
            </div>
        </div>
    </section>

    <style>
        .cancel-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .cancel-content {
            text-align: center;
            max-width: 500px;
        }

        .cancel-icon {
            font-size: 4rem;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            background: rgba(107, 114, 128, 0.1);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .cancel-content h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
        }

        .cancel-content p {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</body>
</html>
