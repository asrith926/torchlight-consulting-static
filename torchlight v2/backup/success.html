<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Torchlight Consulting</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <img src="assets/images/torchlight-logo.png" alt="Torchlight" class="brand-logo">
                <span class="brand-name">Torchlight Consulting</span>
            </div>
        </nav>
    </header>

    <section class="success-page">
        <div class="container">
            <div class="success-content">
                <div class="success-icon">✓</div>
                <h1>Payment Successful!</h1>
                <p>Thank you for your payment. We'll be in touch soon to discuss how we can help accelerate your growth.</p>
                <a href="/" class="btn-primary">Return to Home</a>
            </div>
        </div>
    </section>

    <style>
        .success-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .success-content {
            text-align: center;
            max-width: 500px;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--color-success);
            margin-bottom: 2rem;
            background: rgba(34, 197, 94, 0.1);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .success-content h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
        }

        .success-content p {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</body>
</html>
